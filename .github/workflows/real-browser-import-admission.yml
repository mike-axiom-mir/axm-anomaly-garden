name: Real browser import admission

on:
  pull_request:
  push:
    branches:
      - 'automation/truth-sentinel-real-browser-import-evidence-*'

permissions:
  contents: read

jobs:
  chromium-import:
    name: Chromium file import truth gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run inherited deterministic suite
        run: npm test
      - name: Install CI-only browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise real Chromium file import admission
        run: node tests/real-browser-import-admission.mjs
      - name: Preserve browser truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-garden-browser-import-admission
          path: artifacts/browser-import-admission/
          if-no-files-found: warn
