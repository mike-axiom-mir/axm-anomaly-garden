name: Verify Canonical State Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  state-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check state contract
        run: node --check src/state-contract.js
      - name: Canonical save-state contract regression
        run: node tests/state-contract.test.js
