name: Public capability discovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  generated-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22", "24"]
    steps:
      - name: Checkout Anomaly Garden
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify generated registry is current
        run: node tools/generate-public-capabilities.mjs --check
      - name: Run focused discovery regressions
        run: node --test tests/public-capability-discovery.test.mjs
      - name: Verify complete deterministic suite
        run: npm test
      - name: Verify executable descriptor remains exact
        run: |
          node bin/anomaly-garden.cjs describe > /tmp/anomaly-describe.json
          node - <<'NODE'
          const fs = require('fs');
          const described = JSON.parse(fs.readFileSync('/tmp/anomaly-describe.json', 'utf8'));
          const source = JSON.parse(fs.readFileSync('capability.json', 'utf8'));
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          };
          if (JSON.stringify(canonical(described)) !== JSON.stringify(canonical(source))) {
            throw new Error('executable descriptor drift');
          }
          if (Object.prototype.hasOwnProperty.call(source, 'status')) {
            throw new Error('provider status became declared; discovery classification requires deliberate review');
          }
          NODE

  discovery-buddy-bridge:
    runs-on: ubuntu-latest
    needs: generated-contract
    steps:
      - name: Checkout Anomaly Garden
        uses: actions/checkout@v4
      - name: Checkout pinned Discovery Buddy consumer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-discovery-buddy
          ref: 1a94fc2481d1cfc9234dea7c86af4777126d3924
          path: .ci/discovery-buddy
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and exact-verify public discovery index
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/discovery-buddy
        run: |
          python -m discovery_buddy scan . --public --output-dir /tmp/anomaly-discovery
          python -m discovery_buddy verify . --public --output-dir /tmp/anomaly-discovery
      - name: Prove the real bridge without inventing provider status
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          index = json.loads(Path('/tmp/anomaly-discovery/public-discovery.json').read_text('utf-8'))
          assert index['schema'] == 'axm.discovery-index/v0.1'
          assert index['visibility'] == 'PUBLIC_SAFE_DECLARED_ONLY'
          assert index['summary']['repositories'] == 1
          assert index['summary']['capability_records'] == 1
          repo = index['repositories'][0]
          assert repo['repo'] == 'mike-axiom-mir/axm-anomaly-garden'
          assert 'path' not in repo and 'git' not in repo
          records = repo['capabilities']['records']
          assert len(records) == 1
          record = records[0]
          assert record['id'] == 'axm.anomaly-garden.deterministic-completion-scenario'
          assert record['status'] is None
          assert record['providers'] == ['mike-axiom-mir/axm-anomaly-garden']
          assert record['consumers'] == []
          assert record['source'] == 'registry/capabilities.jsonl'
          assert record['line'] == 1
          sources = repo['capabilities']['sources']
          assert len(sources) == 1 and sources[0]['records'] == 1 and sources[0]['errors'] == 0
          raw = Path('registry/capabilities.jsonl').read_bytes()
          assert sources[0]['sha256'] == hashlib.sha256(raw).hexdigest()
          print('Anomaly Garden -> Discovery Buddy bridge: PASS (status intentionally UNKNOWN)')
          PY
