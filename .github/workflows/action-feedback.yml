name: Worldglass action feedback

on:
  pull_request:
    paths:
      - index.html
      - package.json
      - styles-action-feedback.css
      - src/app.js
      - src/action-feedback.js
      - tests/action-feedback.test.js
      - tests/browser-contract.test.js
      - .github/workflows/action-feedback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete deterministic suite
        run: npm test
      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/action-feedback.js
