name: Verify full Anomaly Garden growth integration

on:
  push:
    branches:
      - integration/growth-days-20260912

permissions:
  contents: read

jobs:
  contract:
    name: Full contract · Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact integration head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check integrated source syntax
        run: |
          node --check src/action-feedback.js
          node --check src/browser-file-admission.js
          node --check src/browser-state-admission.js
          node --check src/city-fidelity.js
          node --check tools/generate-public-capabilities.mjs
      - name: Run complete integrated regression suite
        run: npm test
      - name: Run state and admission contracts
        run: |
          node tests/state-contract.test.js
          node tests/state-contract-parity.test.js
          node tests/deserialization-admission.test.js
          node tests/browser-deserialization-admission.test.js
          node tests/browser-file-admission.test.js
          node tests/browser-strict-file-intake.test.js
      - name: Verify source-backed public discovery
        run: |
          node tools/generate-public-capabilities.mjs --check
          node --test tests/public-capability-discovery.test.mjs
          node bin/anomaly-garden.cjs describe > /tmp/anomaly-describe.json
          node - <<'NODE'
          const fs = require('fs');
          const described = JSON.parse(fs.readFileSync('/tmp/anomaly-describe.json', 'utf8'));
          const source = JSON.parse(fs.readFileSync('capability.json', 'utf8'));
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            return value;
          };
          if (JSON.stringify(canonical(described)) !== JSON.stringify(canonical(source))) throw new Error('executable descriptor drift');
          NODE
      - name: Verify clean tree formatting
        run: git diff --check

  chromium:
    name: Real Chromium · city + import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact integration head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused pre-browser contracts
        run: |
          node tests/city-fidelity.test.js
          node tests/browser-file-admission.test.js
          node tests/browser-strict-file-intake.test.js
      - name: Install CI-only Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Exercise integrated real browser surfaces
        run: |
          node tests/city-fidelity-browser.mjs
          node tests/real-browser-import-admission.mjs
          node tests/real-browser-strict-file-intake.mjs
      - name: Preserve integrated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-garden-growth-integration-browser
          path: artifacts/
          if-no-files-found: warn

  discovery-buddy:
    name: Pinned Discovery Buddy bridge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact integration head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Checkout pinned Discovery Buddy consumer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-discovery-buddy
          ref: 1a94fc2481d1cfc9234dea7c86af4777126d3924
          path: .ci/discovery-buddy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and exact-verify public discovery index
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/discovery-buddy
        run: |
          python -m discovery_buddy scan . --public --output-dir /tmp/anomaly-discovery
          python -m discovery_buddy verify . --public --output-dir /tmp/anomaly-discovery
      - name: Prove bridge classification stays bounded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('/tmp/anomaly-discovery/public-discovery.json').read_text('utf-8'))
          assert index['schema'] == 'axm.discovery-index/v0.1'
          assert index['visibility'] == 'PUBLIC_SAFE_DECLARED_ONLY'
          assert index['summary']['repositories'] == 1
          assert index['summary']['capability_records'] == 1
          record = index['repositories'][0]['capabilities']['records'][0]
          assert record['id'] == 'axm.anomaly-garden.deterministic-completion-scenario'
          assert record['status'] is None
          assert record['providers'] == ['mike-axiom-mir/axm-anomaly-garden']
          assert record['consumers'] == []
          print('Anomaly Garden -> Discovery Buddy integrated bridge: PASS')
          PY
